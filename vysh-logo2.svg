  <text x="134" y="95"  text-anchor="middle" fill="#BAE6FD" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="90">Y</text>
  <text x="66"  y="170" text-anchor="middle" fill="#BAE6FD" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="90">S</text>
  <text x="134" y="170" text-anchor="middle" fill="#BAE6FD" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="90">H</text>
</svg>
