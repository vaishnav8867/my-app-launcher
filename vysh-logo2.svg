<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="55%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#130750"/>
      <stop offset="100%" stop-color="#04000E"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="22" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="12"  cy="12"  r="1.3" fill="white" opacity="0.85"/>
  <circle cx="188" cy="12"  r="1.2" fill="white" opacity="0.70"/>
  <circle cx="12"  cy="188" r="1.3" fill="white" opacity="0.65"/>
  <circle cx="188" cy="188" r="1.1" fill="white" opacity="0.60"/>
  <circle cx="100" cy="8"   r="1.0" fill="white" opacity="0.75"/>
  <circle cx="8"   cy="100" r="1.0" fill="white" opacity="0.60"/>
  <circle cx="192" cy="100" r="1.0" fill="white" opacity="0.65"/>
  <circle cx="100" cy="192" r="1.0" fill="white" opacity="0.55"/>

  <!-- Letters: VY top row, SH bottom row — centred -->
