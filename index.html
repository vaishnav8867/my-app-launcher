<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="vysh-logo2.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Apps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 40px 24px 60px;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 40px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      max-width: 900px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      #grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 480px) {
      #grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      border-radius: 4px;
      padding: 4px;
    }

    .app-tile:hover {
      transform: scale(1.08);
    }

    .app-tile:hover .icon {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .icon {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 22%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 8vw, 3.2rem);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: box-shadow 0.18s ease;
    }

    .app-name {
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.01em;
      line-height: 1.3;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>My Apps</h1>
  <div id="grid"></div>

  <script src="apps.js"></script>
  <script>
    const grid = document.getElementById("grid");

    APPS.forEach(({ name, url, emoji, color }) => {
      const a = document.createElement("a");
      a.className = "app-tile";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `
        <div class="icon" style="background:${color}">${emoji}</div>
        <span class="app-name">${name}</span>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
